# SPDX-License-Identifier: MIT
#
# Crawls upstream releases (like the old repo updater did) and proposes the
# changes as package-file edits: metadata, versions, sources and icons.
# Committing the result triggers Publish, which builds and uploads.
name: Sync upstream

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync package files with upstream releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sync_upstream.py

      - name: Commit and push changes
        run: |
          git add core/*.json community/*.json core/icons/* community/icons/*
          if git diff --cached --quiet; then
            echo "No upstream changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync package files with upstream releases"
          git push
